[colors]
background = #331E1E1E
background-alt = #bf1e1e1e
foreground = #ffffff
foreground-alt = #8a8a8a
foreground-dim = #5a5a5a
primary = #1b9fc6
secondary = #ffffff
alert = #bd2c40
accent = #ffbb00
separator = #5a5a5a


[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 20pt
radius = 0
fixed-center = false
bottom = false
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 2

module-margin-left = 1
module-margin-right = 1

separator = "·"
separator-foreground = ${colors.separator}

font-0 = JetBrainsMono Nerd Font Mono:size=12;6

modules-left = xworkspaces i3layout
modules-center = xwindow
; No tray here - only one bar may own the tray selection, so the tray lives in
; [bar/toph-tray] below, which launch_polybar.sh starts on the primary monitor.
; Do not try to inject the module name with ${env:...}: polybar 3.7 does not
; expand variables inside modules-* lists, it looks up the literal string.
modules-right = protonvpn pacman-updates temperature spotify spotify-play-pause pulseaudio memory cpu wlan filesystem powermenu date keys

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; Identical to toph, plus the system tray. Primary monitor only.
[bar/toph-tray]
inherit = bar/toph
modules-right = systray protonvpn pacman-updates temperature spotify spotify-play-pause pulseaudio memory cpu wlan filesystem powermenu date keys

[module/temperature]
type = internal/temperature
; Zone 1 is x86_pkg_temp (actual CPU package); zone 0 is acpitz.
thermal-zone = 1
warn-temperature = 75

format = <ramp> <label>
format-warn = <ramp> <label-warn>

label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-foreground = ${colors.primary}


[module/pacman-updates]
type = custom/script
exec = checkupdates 2>/dev/null | wc -l
interval = 1000
label = %output%
format-foreground = ${colors.foreground}
format-background = ${colors.background}
format-prefix = " "
format-prefix-foreground = ${colors.accent}


; override-redirect = true
[module/i3layout]
type = custom/script
exec = ~/.config/polybar/scripts/i3layout.sh
interval = 1
label = %output%
format = <label>


[module/keys]
type = custom/script
exec = echo "" ""
interval = 0
click-left = ~/.config/i3/scripts/keyhint


[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces
; Only show workspaces defined on the same output as the bar
;
; Useful if you want to show monitor specific workspaces
; on different bars
;
; Default: false
pin-workspaces = true

; Groups workspaces by monitor. If set to false, workspaces are not grouped and
; appear in the order provided by the WM
; If set to false, cannot be used together with label-monitor
; New in version 3.7.0
; Default: true
group-by-monitor = true

; Create click handler used to focus desktop
; Default: true
enable-click = true
enable-scroll = false

label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.secondary}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-underline =${colors.secondary}
label-occupied-padding = 1

label-empty = %name%
label-empty-padding = 1

label-urgent = %name%
label-urgent-foreground =${colors.alert}
label-urgent-background = ${colors.secondary}
label-urgent-underline = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted =   %free%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.primary}

[module/spotify]
type = custom/script
tail = true
interval = 1
; prefix symbol is shown before the text
format-prefix = " "
format-prefix-foreground = #1ed760
format = <label>
exec = ~/.config/polybar/scripts/scroll_spotify_status.sh
click-left = playerctl next -p spotify
click-right = playerctl previous -p spotify

[module/spotify-play-pause]
type = custom/script
exec = ~/.config/polybar/scripts/spotify_play_pause.sh
tail = true
format-foreground = ${colors.foreground}
click-left = playerctl play-pause -p spotify

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume> <bar-volume>
label-volume =  %percentage%%
label-volume-foreground = ${colors.foreground}

label-muted = ? muted
label-muted-foreground = #666

bar-volume-width = 10
bar-volume-foreground-0 = #55aa55
bar-volume-foreground-1 = #55aa55
bar-volume-foreground-2 = #55aa55
bar-volume-foreground-3 = #55aa55
bar-volume-foreground-4 = #55aa55
bar-volume-foreground-5 = #f5a70a
bar-volume-foreground-6 = #ff5555
bar-volume-gradient = false
bar-volume-indicator = |
bar-volume-indicator-font = 2
bar-volume-fill = ─
bar-volume-fill-font = 2
bar-volume-empty = ─
bar-volume-empty-font = 2
bar-volume-empty-foreground = ${colors.foreground-alt}


[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %gb_used%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#8a8a8a}%ifname%%{F#5a5a5a} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{F#1b9fc6}%ifname%%{F-} %essid%

; Stands in for Proton VPN's tray icon, which cannot be shown here - see the
; script for why. Click opens the app window.
[module/protonvpn]
type = custom/script
exec = ~/.config/polybar/scripts/protonvpn.sh
interval = 5
click-left = protonvpn-app

[module/powermenu]
type = custom/menu

expand-right = true

format-spacing = 1

label-open = 
label-open-foreground = ${colors.secondary}
label-close =  cancel
label-close-foreground = ${colors.alert}
label-separator = |
label-separator-foreground = ${colors.foreground-alt}

menu-0-0 = reboot
menu-0-0-exec = systemctl reboot
menu-0-1 = power off
menu-0-1-exec = systemctl poweroff

[module/date]
type = internal/date
interval = 1

date =
date-alt = " %d-%m-%Y"

time = %H:%M
time-alt = %H:%M:%S

format-prefix = 
format-prefix-foreground = ${colors.primary}


label = %date% %time%


[settings]
screenchange-reload = true
;compositing-background = xor
;compositing-background = screen
compositing-foreground = source
;compositing-border = over
[global/wm]
margin-top = 5
margin-bottom = 5

; vim:ft=dosini
